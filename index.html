<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebSDR - RTL-TCP Client</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --text-primary: #eee;
            --text-secondary: #aaa;
            --border: #333;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
        }

        .status-dot.connected {
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main content - graphs take 2/3, controls take 1/3 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0.5rem;
            gap: 0.25rem;
        }

        /* Connection Panel - compact */
        .connection-panel {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            flex-shrink: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        input[type="number"] {
            width: 120px;
        }

        .freq-input {
            width: 150px !important;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
        }

        button {
            background: var(--accent);
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        .btn-connect {
            padding: 0.5rem 1.5rem;
        }

        .btn-disconnect {
            background: #ef4444;
        }

        /* Controls Panel - compact horizontal */
        .controls-panel {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            flex-shrink: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 150px;
            flex: 1;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-label span {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .control-value {
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            color: var(--accent);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .mode-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .mode-btn {
            flex: 1;
            padding: 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            font-size: 0.75rem;
        }

        .mode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Visualization Area - takes up most of available space */
        .visualization {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-height: 200px;
            overflow: hidden;
        }

        .canvas-container {
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .spectrum-container {
            flex: 1;
            min-height: 80px;
        }

        .waterfall-container {
            flex: 2;
            min-height: 120px;
        }

        .waveform-container {
            flex: 0.5;
            min-height: 50px;
        }

        .canvas-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-label {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.5);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .freq-scale {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            display: flex;
            justify-content: space-between;
            padding: 0 0.5rem;
            font-size: 0.625rem;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.3);
        }

        /* Audio controls - compact */
        .audio-controls {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .record-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }

        .record-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: #ef4444;
        }

        .record-btn.recording {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            animation: record-pulse 1s ease-in-out infinite;
        }

        @keyframes record-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .recording-time {
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            color: #ef4444;
            min-width: 50px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            max-width: 200px;
        }

        .volume-icon {
            font-size: 1.25rem;
        }

        .audio-meter {
            flex: 1;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }

        .audio-meter-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--warning), var(--accent));
            width: 0%;
            transition: width 0.05s;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            gap: 0.25rem;
        }

        .stat-value {
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            header {
                padding: 0.5rem;
            }

            .logo {
                font-size: 1rem;
            }

            main {
                padding: 0.25rem;
                gap: 0.25rem;
            }

            .connection-panel {
                padding: 0.75rem;
            }

            .controls-panel {
                padding: 0.75rem;
                grid-template-columns: 1fr 1fr;
            }

            .input-group input,
            .input-group select {
                width: 100%;
            }

            .freq-input {
                width: 100% !important;
            }

            .visualization {
                flex-direction: column;
            }

            .canvas-container {
                min-height: 120px;
            }
        }

        @media (max-width: 480px) {
            .controls-panel {
                grid-template-columns: 1fr;
            }

            .connection-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group {
                width: 100%;
            }
        }

        /* Landscape mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .visualization {
                flex-direction: row;
            }

            .canvas-container {
                min-height: 80px;
            }
        }

        /* Tuning dial indicator - moveable, appears on all displays */
        .tuning-indicator {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 100%;
            background: var(--accent);
            opacity: 0.9;
            pointer-events: none;
            z-index: 10;
            transition: left 0.05s ease-out;
        }

        /* Center marker - shows the center of the display */
        .center-marker {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            z-index: 5;
        }

        /* Prominent Frequency Control Panel - compact horizontal layout */
        .frequency-panel {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border-radius: 8px;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-shrink: 0;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .frequency-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .frequency-main {
            display: flex;
            align-items: baseline;
            justify-content: center;
        }

        .frequency-main-input {
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
            background: transparent;
            border: none;
            outline: none;
            width: 180px;
            text-align: right;
            cursor: text;
        }

        .frequency-main-input:hover {
            color: var(--accent-hover);
        }

        .frequency-main-input:focus {
            background: rgba(233, 69, 96, 0.1);
            border-radius: 4px;
        }

        .frequency-unit {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-left: 0.25rem;
        }

        .frequency-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .freq-step-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 0.35rem 0.5rem;
            font-size: 0.7rem;
            font-family: 'Courier New', monospace;
            min-width: 50px;
        }

        .freq-step-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .freq-step-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .freq-adjust-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .freq-adjust-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .freq-input-row {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .freq-direct-input {
            width: 130px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            text-align: center;
            padding: 0.35rem 0.5rem;
        }

        .freq-go-btn {
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
        }

        /* Clickable canvas cursor */
        .canvas-container canvas {
            cursor: crosshair;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error toast */
        .toast {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* Hamburger Menu */
        .hamburger-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger-btn:hover {
            color: var(--accent);
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: var(--bg-secondary);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.3);
        }

        .side-menu.active {
            right: 0;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .menu-header h2 {
            font-size: 1.1rem;
            color: var(--accent);
        }

        .menu-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0;
        }

        .menu-close-btn:hover {
            color: var(--text-primary);
        }

        .menu-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .bookmark-section {
            margin-bottom: 1.5rem;
        }

        .bookmark-section h3 {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
        }

        .add-bookmark {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .add-bookmark input {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.875rem;
        }

        .add-bookmark button {
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            white-space: nowrap;
        }

        .bookmark-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .bookmark-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .bookmark-item:hover {
            background: var(--bg-primary);
            transform: translateX(4px);
        }

        .bookmark-item:active {
            transform: translateX(2px);
        }

        .bookmark-freq {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            color: var(--accent);
            min-width: 90px;
        }

        .bookmark-label {
            flex: 1;
            font-size: 0.875rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-mode {
            font-size: 0.7rem;
            padding: 0.2rem 0.4rem;
            background: var(--bg-secondary);
            border-radius: 3px;
            color: var(--text-secondary);
        }

        .bookmark-delete {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 0.25rem;
            opacity: 0.5;
            transition: opacity 0.2s, color 0.2s;
        }

        .bookmark-delete:hover {
            opacity: 1;
            color: #ef4444;
        }

        .no-bookmarks {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            padding: 2rem 1rem;
        }

        .preset-bookmarks {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            margin-top: 0.5rem;
        }

        .preset-bookmarks h4 {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .preset-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .preset-btn {
            padding: 0.4rem 0.6rem;
            font-size: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .preset-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Secure checkbox */
        .secure-toggle {
            display: flex;
            align-items: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-label span {
            text-transform: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">📻 WebSDR</div>
            <div class="connection-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <button class="hamburger-btn" id="menuBtn" title="Bookmarks">☰</button>
        </header>

        <main>
            <!-- Prominent Frequency Control Panel -->
            <div class="frequency-panel">
                <div class="frequency-display">
                    <button class="freq-adjust-btn" id="freqDown" title="Decrease frequency">−</button>
                    <div class="frequency-main">
                        <input type="text" id="frequencyDisplay" class="frequency-main-input" value="100.000" title="Click to edit frequency">
                        <span class="frequency-unit">MHz</span>
                    </div>
                    <button class="freq-adjust-btn" id="freqUp" title="Increase frequency">+</button>
                </div>
                <div class="frequency-controls">
                    <button class="freq-step-btn" data-step="0.001">1 kHz</button>
                    <button class="freq-step-btn" data-step="0.01">10 kHz</button>
                    <button class="freq-step-btn" data-step="0.025">25 kHz</button>
                    <button class="freq-step-btn active" data-step="0.1">100 kHz</button>
                    <button class="freq-step-btn" data-step="1">1 MHz</button>
                </div>
            </div>

            <!-- Connection Panel -->
            <div class="connection-panel">
                <div class="input-group">
                    <label>WebSocket Host</label>
                    <input type="text" id="wsHost" value="192.168.1.126" placeholder="Host IP or domain">
                </div>
                <div class="input-group">
                    <label>WS Port</label>
                    <input type="number" id="wsPort" value="8081" min="1" max="65535">
                </div>
                <div class="input-group">
                    <label>Sample Rate</label>
                    <select id="sampleRate">
                        <option value="250000">250 kHz</option>
                        <option value="1024000">1.024 MHz</option>
                        <option value="1800000">1.8 MHz</option>
                        <option value="2048000" selected>2.048 MHz</option>
                        <option value="2400000">2.4 MHz</option>
                    </select>
                </div>
                <div class="input-group secure-toggle">
                    <label class="checkbox-label">
                        <input type="checkbox" id="secureWs" checked>
                        <span>Secure (WSS)</span>
                    </label>
                </div>
                <button class="btn-connect" id="connectBtn">Connect</button>
            </div>

            <!-- Controls Panel -->
            <div class="controls-panel">
                <div class="control-group">
                    <div class="control-label">
                        <span>Gain</span>
                        <span class="control-value" id="gainValue">Auto</span>
                    </div>
                    <input type="range" id="gainSlider" min="0" max="50" value="0">
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>Squelch</span>
                        <span class="control-value" id="squelchValue">Off</span>
                    </div>
                    <input type="range" id="squelchSlider" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>Filter BW</span>
                        <span class="control-value" id="filterValue">Auto</span>
                    </div>
                    <input type="range" id="filterSlider" min="0" max="100" value="50">
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>Mode</span>
                    </div>
                    <div class="mode-buttons">
                        <button class="mode-btn active" data-mode="wfm">WFM</button>
                        <button class="mode-btn" data-mode="nfm">NFM</button>
                        <button class="mode-btn" data-mode="am">AM</button>
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>Spectrum Min</span>
                        <span class="control-value" id="specMinValue">-80 dB</span>
                    </div>
                    <input type="range" id="specMinSlider" min="-120" max="-20" value="-80">
                </div>

                <div class="control-group">
                    <div class="control-label">
                        <span>Spectrum Max</span>
                        <span class="control-value" id="specMaxValue">0 dB</span>
                    </div>
                    <input type="range" id="specMaxSlider" min="-60" max="20" value="0">
                </div>
            </div>

            <!-- Visualization -->
            <div class="visualization">
                <div class="canvas-container spectrum-container" id="spectrumContainer">
                    <span class="canvas-label">Spectrum</span>
                    <canvas id="spectrumCanvas"></canvas>
                    <div class="center-marker"></div>
                    <div class="tuning-indicator" id="spectrumIndicator"></div>
                </div>
                <div class="canvas-container waterfall-container" id="waterfallContainer">
                    <span class="canvas-label">Waterfall</span>
                    <canvas id="waterfallCanvas"></canvas>
                    <div class="center-marker"></div>
                    <div class="tuning-indicator" id="waterfallIndicator"></div>
                    <div class="freq-scale" id="freqScale"></div>
                </div>
                <div class="canvas-container waveform-container" id="waveformContainer">
                    <span class="canvas-label">Waveform</span>
                    <canvas id="waveformCanvas"></canvas>
                    <div class="center-marker"></div>
                    <div class="tuning-indicator" id="waveformIndicator"></div>
                </div>
            </div>

            <!-- Audio Controls -->
            <div class="audio-controls">
                <button class="play-btn" id="playBtn">▶</button>
                <button class="record-btn" id="recordBtn" title="Record audio">⏺</button>
                <span class="recording-time" id="recordingTime"></span>
                <div class="volume-control">
                    <span class="volume-icon">🔊</span>
                    <input type="range" id="volumeSlider" min="0" max="100" value="50">
                </div>
                <div class="audio-meter">
                    <div class="audio-meter-fill" id="audioMeter"></div>
                </div>
                <div class="stats-bar">
                    <div class="stat">Buffer: <span class="stat-value" id="bufferStat">0</span></div>
                    <div class="stat">Rate: <span class="stat-value" id="rateStat">0 kS/s</span></div>
                    <div class="stat">Signal: <span class="stat-value" id="signalStat">-∞ dB</span></div>
                </div>
            </div>
        </main>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h2>📑 Bookmarks</h2>
            <button class="menu-close-btn" id="menuCloseBtn">×</button>
        </div>
        <div class="menu-content">
            <div class="bookmark-section">
                <h3>Add Current Frequency</h3>
                <div class="add-bookmark">
                    <input type="text" id="bookmarkLabel" placeholder="Label (e.g. Local FM)">
                    <button id="addBookmarkBtn">+ Add</button>
                </div>
            </div>

            <div class="bookmark-section">
                <h3>My Bookmarks</h3>
                <div class="bookmark-list" id="bookmarkList">
                    <div class="no-bookmarks">No bookmarks yet. Add your favorite frequencies!</div>
                </div>
            </div>

            <div class="bookmark-section preset-bookmarks">
                <h4>Quick Presets</h4>
                <div class="preset-list">
                    <button class="preset-btn" data-freq="88.1" data-mode="wfm">88.1 FM</button>
                    <button class="preset-btn" data-freq="98.7" data-mode="wfm">98.7 FM</button>
                    <button class="preset-btn" data-freq="101.1" data-mode="wfm">101.1 FM</button>
                    <button class="preset-btn" data-freq="162.55" data-mode="nfm">NOAA WX</button>
                    <button class="preset-btn" data-freq="121.5" data-mode="am">Air Emer</button>
                    <button class="preset-btn" data-freq="144.39" data-mode="nfm">APRS</button>
                    <button class="preset-btn" data-freq="146.52" data-mode="nfm">2m Call</button>
                    <button class="preset-btn" data-freq="462.5625" data-mode="nfm">FRS 1</button>
                </div>
            </div>
        </div>
    </div>

    <script src="sdr.js"></script>
</body>
</html>
